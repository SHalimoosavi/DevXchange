<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">DevXchange licence tiers</title><desc id="d">Plain-language comparison of Personal, Commercial, Extended and Enterprise licences.</desc><rect width="1200" height="620" rx="28" fill="#F7F9FC"/><text x="70" y="78" fill="#0E1A2B" font-family="Arial" font-size="42" font-weight="700">Licences in plain language</text><text x="70" y="116" fill="#607089" font-family="Arial" font-size="23">Standard terms for every listing. Sellers choose a tier, not custom wording.</text><g transform="translate(70 165)" font-family="Arial"><g fill="#0E1A2B"><rect x="320" width="190" height="55" rx="10"/><rect x="525" width="190" height="55" rx="10"/><rect x="730" width="190" height="55" rx="10"/><rect x="935" width="190" height="55" rx="10"/></g><g fill="#fff" font-size="20" font-weight="700" text-anchor="middle"><text x="415" y="36">Personal</text><text x="620" y="36">Commercial</text><text x="825" y="36">Extended</text><text x="1030" y="36">Enterprise</text></g><g fill="#fff"><rect y="75" width="1125" height="54" rx="10"/><rect y="140" width="1125" height="54" rx="10"/><rect y="205" width="1125" height="54" rx="10"/><rect y="270" width="1125" height="54" rx="10"/><rect y="335" width="1125" height="54" rx="10"/></g><g fill="#0E1A2B" font-size="18"><text x="20" y="109">Use in a project</text><text x="20" y="174">Modify the source</text><text x="20" y="239">Deploy to production</text><text x="20" y="304">Resell or redistribute source</text><text x="20" y="369">Use in multiple projects</text></g><g fill="#29966E" font-size="25" font-weight="700" text-anchor="middle"><text x="415" y="110">✓</text><text x="620" y="110">✓</text><text x="825" y="110">✓</text><text x="1030" y="110">✓</text><text x="415" y="175">✓</text><text x="620" y="175">✓</text><text x="825" y="175">✓</text><text x="1030" y="175">✓</text><text x="620" y="240">✓</text><text x="825" y="240">✓</text><text x="1030" y="240">✓</text><text x="825" y="370">✓</text><text x="1030" y="370">✓</text></g><g fill="#718198" font-size="25" font-weight="700" text-anchor="middle"><text x="415" y="240">×</text><text x="415" y="305">×</text><text x="620" y="305">×</text><text x="825" y="305">×</text><text x="1030" y="305">×</text><text x="415" y="370">×</text><text x="620" y="370">×</text></g></g><text x="70" y="590" fill="#607089" font-family="Arial" font-size="18">Illustrative summary. Exact terms are stated on each listing; Enterprise terms require an agreement.</text></svg>

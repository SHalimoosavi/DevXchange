<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">DevXchange verification levels</title><desc id="d">Six verification levels from 0 unverified to 5 DevXchange certified.</desc><rect width="1200" height="620" rx="28" fill="#F7F9FC"/><text x="70" y="78" fill="#0E1A2B" font-family="Arial" font-size="42" font-weight="700">Verification you can read</text><text x="70" y="116" fill="#607089" font-family="Arial" font-size="23">Levels describe what was checked. Badges cannot be bought.</text><g transform="translate(70 160)" font-family="Arial"><g fill="#D5DEEA"><rect x="0" y="230" width="180" height="150" rx="12"/><rect x="195" y="175" width="180" height="205" rx="12" fill="#B8C8DE"/><rect x="390" y="120" width="180" height="260" rx="12" fill="#8EA9D5"/><rect x="585" y="65" width="180" height="315" rx="12" fill="#2F6BFF"/><rect x="780" y="10" width="180" height="370" rx="12" fill="#5D87EA"/><rect x="975" y="-35" width="120" height="415" rx="12" fill="#E8B23A"/></g><g fill="#0E1A2B" font-size="28" font-weight="700"><text x="90" y="325" text-anchor="middle">0</text><text x="285" y="270" text-anchor="middle">1</text><text x="480" y="215" text-anchor="middle">2</text><text x="675" y="160" text-anchor="middle" fill="#fff">3</text><text x="870" y="105" text-anchor="middle" fill="#fff">4</text><text x="1035" y="60" text-anchor="middle">5</text></g><g fill="#0E1A2B" font-size="17" font-weight="700"><text x="90" y="410" text-anchor="middle">Unverified</text><text x="285" y="410" text-anchor="middle">Listing verified</text><text x="480" y="410" text-anchor="middle">Build verified</text><text x="675" y="410" text-anchor="middle">Deployment verified</text><text x="870" y="410" text-anchor="middle">Security reviewed</text><text x="1035" y="410" text-anchor="middle">Certified</text></g></g><text x="70" y="565" fill="#607089" font-family="Arial" font-size="20">Checks that are not yet automated are shown as “Not yet checked”, never as a pass.</text></svg>

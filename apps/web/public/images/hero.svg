<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" role="img" aria-labelledby="t d"><title id="t">DevXchange trusted software marketplace</title><desc id="d">A clean marketplace hero showing verification evidence, technology stack and licence details.</desc><rect width="1536" height="864" fill="#0E1A2B"/><text x="96" y="165" fill="#fff" font-family="Arial" font-size="76" font-weight="700">Buy software</text><text x="96" y="245" fill="#fff" font-family="Arial" font-size="76" font-weight="700">you can trust.</text><text x="96" y="320" fill="#A9B9CF" font-family="Arial" font-size="28">Every listing shows what was actually checked,</text><text x="96" y="358" fill="#A9B9CF" font-family="Arial" font-size="28">which licence applies, and which version you get.</text><rect x="96" y="410" width="240" height="64" rx="12" fill="#2F6BFF"/><text x="216" y="451" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Browse listings</text><rect x="356" y="410" width="240" height="64" rx="12" fill="none" stroke="#617795" stroke-width="2"/><text x="476" y="451" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Sell software</text><rect x="790" y="105" width="650" height="590" rx="24" fill="#F1F4F8"/><text x="830" y="155" fill="#7788A0" font-family="Arial" font-size="21">Sample listing</text><text x="830" y="205" fill="#0E1A2B" font-family="Arial" font-size="35" font-weight="700">Multi-tenant SaaS starter</text><text x="830" y="245" fill="#52647D" font-family="Arial" font-size="21">Next.js · TypeScript · PostgreSQL · Docker</text><line x1="830" y1="275" x2="1400" y2="275" stroke="#C7D0DD" stroke-width="2"/><text x="830" y="325" fill="#0E1A2B" font-family="Arial" font-size="22" font-weight="700">Verification</text><rect x="1160" y="293" width="220" height="48" rx="24" fill="#2F6BFF"/><text x="1270" y="324" fill="#fff" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Level 2 · Build verified</text><g font-family="Arial" font-size="20" fill="#26384F"><text x="875" y="385">✓</text><text x="875" y="440">✓</text><text x="875" y="495">✓</text><text x="875" y="550">✓</text><text x="875" y="605">○</text><text x="910" y="385">Build</text><text x="910" y="440">Installation</text><text x="910" y="495">Dependency manifest</text><text x="910" y="550">Secret pattern scan</text><text x="910" y="605">Deployment test</text><text x="1280" y="385" fill="#29966E" font-weight="700">PASS</text><text x="1280" y="440" fill="#29966E" font-weight="700">PASS</text><text x="1280" y="495" fill="#29966E" font-weight="700">PASS</text><text x="1280" y="550" fill="#29966E" font-weight="700">PASS</text><text x="1280" y="605" fill="#718198" font-weight="700">Not yet checked</text></g><line x1="830" y1="640" x2="1400" y2="640" stroke="#C7D0DD" stroke-width="2"/><text x="830" y="674" fill="#52647D" font-family="Arial" font-size="18">Licence: Commercial, single project · Version 2.4.1</text><text x="96" y="720" fill="#B8C5D8" font-family="Arial" font-size="23" font-weight="700">By Syed Ali Hasan Moosavi</text><text x="96" y="752" fill="#70839D" font-family="Arial" font-size="19">SAYANJALI NEXUS PRIVATE LIMITED · Hyderabad</text></svg>

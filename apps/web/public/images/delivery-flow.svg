<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">DevXchange payment to download flow</title><desc id="d">Order, payment, licence, authorisation and an expiring download link.</desc><rect width="1200" height="520" rx="28" fill="#0E1A2B"/><text x="70" y="78" fill="#fff" font-family="Arial" font-size="42" font-weight="700">From payment to download</text><text x="70" y="116" fill="#B8C5D8" font-family="Arial" font-size="23">No permanent ZIP link. Every download is authorised and time-limited.</text><g transform="translate(70 190)" font-family="Arial"><g fill="#162A45" stroke="#2D4A70" stroke-width="2"><rect width="190" height="150" rx="18"/><rect x="225" width="190" height="150" rx="18"/><rect x="450" width="190" height="150" rx="18"/><rect x="675" width="190" height="150" rx="18"/><rect x="900" width="190" height="150" rx="18"/></g><g fill="#2F6BFF"><circle cx="35" cy="38" r="22"/><circle cx="260" cy="38" r="22"/><circle cx="485" cy="38" r="22"/><circle cx="710" cy="38" r="22"/><circle cx="935" cy="38" r="22" fill="#E8B23A"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="29" y="45">1</text><text x="254" y="45">2</text><text x="479" y="45">3</text><text x="704" y="45">4</text><text x="929" y="45">5</text><text x="26" y="88">Order</text><text x="251" y="88">Payment</text><text x="476" y="88">Licence</text><text x="701" y="88">Authorisation</text><text x="926" y="88">Download</text></g><g fill="#8FA3BE" font-size="16"><text x="26" y="116">Product + licence</text><text x="251" y="116">Provider confirmed</text><text x="476" y="116">Licence ID issued</text><text x="701" y="116">Rights checked</text><text x="926" y="116">Signed link expires</text></g></g><rect x="70" y="385" width="1060" height="70" rx="16" fill="#0A1525" stroke="#2D4A70" stroke-width="2"/><text x="95" y="417" fill="#E8B23A" font-family="Arial" font-size="20" font-weight="700">Licence DVX-XXXXXXXX</text><text x="95" y="443" fill="#8FA3BE" font-family="Arial" font-size="17">Product, buyer, licence type, purchase date and purchased version are recorded.</text></svg>

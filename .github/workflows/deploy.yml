name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install image build utility
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /DevXchange
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Fail if privileged Supabase material reaches the client
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if grep -R -F "$SUPABASE_SERVICE_ROLE_KEY" apps/web/out .next 2>/dev/null; then
              echo "A Supabase service-role secret was found in build output."
              exit 1
            fi
          fi
          if grep -R -n -E 'service_role|SUPABASE_SERVICE_ROLE_KEY' apps/web/out .next 2>/dev/null; then
            echo "Privileged Supabase identifiers were found in build output."
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install dependencies for Lighthouse browser
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Run Lighthouse against deployed site
        run: |
          CHROME_PATH="$(node -e "const {chromium}=require('./apps/web/node_modules/playwright'); console.log(chromium.executablePath())")"
          npx --yes lighthouse@12.8.2 https://shalimoosavi.github.io/DevXchange/ --chrome-path="$CHROME_PATH" --output=json --output-path=/tmp/lighthouse.json --quiet
          node -e "const r=require('/tmp/lighthouse.json'); for (const k of ['performance','accessibility','best-practices','seo']) console.log(k+': '+Math.round((r.categories[k]?.score||0)*100));"
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse.json
